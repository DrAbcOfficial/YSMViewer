name: Build & Release

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build Desktop
        run: dotnet build YSMViewer.Desktop -c Release

  publish-desktop:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
          - rid: linux-x64
            os: ubuntu-latest
          - rid: osx-arm64
            os: macos-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Publish Desktop (${{ matrix.rid }})
        run: dotnet publish YSMViewer.Desktop -c Release -r ${{ matrix.rid }} -o publish/desktop-${{ matrix.rid }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.rid }}
          path: publish/desktop-${{ matrix.rid }}/

  publish-thumbnail:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Publish C# NativeAOT rendering DLL
        run: dotnet publish YSMViewer.ThumbnailProvider -c Release -r win-x64 -o publish/thumbnail

      - name: Setup MSVC
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64

      - name: Build C++ COM wrapper DLL
        run: |
          msbuild YSMViewer.ThumbnailProvider.Cpp\YSMViewer.ThumbnailProvider.Cpp.vcxproj /p:Configuration=Release /p:OutDir="${{ github.workspace }}\publish\thumbnail\" /p:IntDir="${{ runner.temp }}\thumbnail-obj\" /nologo

      - name: Copy registration scripts
        shell: pwsh
        run: |
          Copy-Item YSMViewer.ThumbnailProvider.Cpp/install.ps1 publish/thumbnail/
          Copy-Item YSMViewer.ThumbnailProvider.Cpp/uninstall.ps1 publish/thumbnail/

      - name: Clean up unnecessary build artifacts
        shell: cmd
        run: |
          del /f /q publish\thumbnail\*.exp publish\thumbnail\*.lib publish\thumbnail\*.ilk publish\thumbnail\*.pdb 2>nul || ver>nul

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: thumbnail-win-x64
          path: publish/thumbnail/

  publish-browser:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Install wasm-tools
        run: dotnet workload install wasm-tools

      - name: Publish Browser
        run: dotnet publish YSMViewer.Browser -c Release -o publish/browser

      - name: Build Android APK
        uses: kimhuilim/web-to-app-action@Alpha3
        with:
          build-folder-path: "publish/browser/wwwroot"
          app-name: "YSMViewer"
          app-id-apk: "net.drabc.ysmviewer"
          output-folder-path: "publish"

      - name: Rename and upload APK
        run: mv publish/release/app-release.apk publish/YSMViewer-Android.apk

      - name: Upload browser site
        uses: actions/upload-artifact@v7
        with:
          name: browser
          path: publish/browser/

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: publish/YSMViewer-Android.apk

  release:
    needs: [publish-desktop, publish-thumbnail, publish-browser]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Download desktop (win-x64)
        uses: actions/download-artifact@v7
        with:
          name: desktop-win-x64
          path: publish/desktop/win-x64

      - name: Download desktop (linux-x64)
        uses: actions/download-artifact@v7
        with:
          name: desktop-linux-x64
          path: publish/desktop/linux-x64

      - name: Download desktop (osx-arm64)
        uses: actions/download-artifact@v7
        with:
          name: desktop-osx-arm64
          path: publish/desktop/osx-arm64

      - name: Download thumbnail provider
        uses: actions/download-artifact@v7
        with:
          name: thumbnail-win-x64
          path: publish/thumbnail

      - name: Download browser site
        uses: actions/download-artifact@v7
        with:
          name: browser
          path: publish/browser

      - name: Download APK
        uses: actions/download-artifact@v7
        with:
          name: android-apk
          path: publish

      - name: Package desktop assets
        run: |
          cd publish/desktop
          zip -r ../YSMViewer-win-x64.zip win-x64/
          zip -r ../YSMViewer-linux-x64.zip linux-x64/
          zip -r ../YSMViewer-osx-arm64.zip osx-arm64/

      - name: Add .nojekyll for GitHub Pages
        run: touch publish/browser/wwwroot/.nojekyll

      - name: Package browser assets
        run: |
          cd publish/browser
          zip -r ../YSMViewer-Browser.zip .

      - name: Package thumbnail provider
        run: |
          cd publish/thumbnail
          zip -r ../YSMViewer-ThumbnailProvider-win-x64.zip .

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            publish/YSMViewer-win-x64.zip
            publish/YSMViewer-linux-x64.zip
            publish/YSMViewer-osx-arm64.zip
            publish/YSMViewer-Browser.zip
            publish/YSMViewer-Android.apk
            publish/YSMViewer-ThumbnailProvider-win-x64.zip
          generate_release_notes: true

      - name: Deploy to webpage branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: publish/browser/wwwroot
          publish_branch: webpage
          force_orphan: true